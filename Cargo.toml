[package]
name = "vellum"
version = "0.1.0"
edition = "2021"
description = "A modern, keyboard-centric, distraction-free TUI web browser with native Sixel graphics."
license = "MIT"

[dependencies]
# TUI & Terminal Handling
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.29", features = ["events", "event-stream"] }

# HTTP & Network (lightweight, rustls-based)
ureq = { version = "2.10", features = ["tls"] }
url = "2.5"

# HTML Parsing & Reader Mode
scraper = "0.27"
readability = "0.3"

# Images & Sixel
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "hdr"] }

# Utilities
unicode-width = "0.2"
log = "0.4"
env_logger = "0.11"
